<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de humo — HIERRO</title>
<style>
  body { background:#0B0C0D; color:#F4F5F7; font:14px/1.5 system-ui, sans-serif; margin:0; padding:16px; }
  h1 { font-size:20px; }
  #log { white-space:pre-wrap; font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  .ok { color:#A6E22E; }
  .bad { color:#FF8B7A; }
  iframe { position:fixed; right:12px; bottom:12px; width:390px; height:780px; border:1px solid #2C3037; }
</style>
</head>
<body>
<h1>Prueba de humo</h1>
<p>Recorre el flujo real de la app dentro de un iframe. Cargá esta página desde un servidor
(<code>python -m http.server</code>), no con <code>file://</code>.</p>
<div id="log">Ejecutando…</div>
<iframe id="app" src="../index.html" title="App bajo prueba"></iframe>

<script>
var log = document.getElementById('log');
var results = [];
function check(name, cond, extra) {
  results.push({ name: name, ok: !!cond, extra: extra || '' });
  log.textContent += '\n' + (cond ? 'OK   ' : 'FALLA') + '  ' + name + (cond ? '' : '  → ' + (extra || ''));
  log.className = cond ? 'ok' : 'bad';
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
/* Cede tiempo REAL. Con el reloj virtual de Chrome los temporizadores se
   adelantan y las operaciones que tardan de verdad (PBKDF2, IndexedDB) quedan
   pendientes; un pedido de red real obliga a esperar. */
function yieldReal() {
  return fetch('ping.txt?_=' + Math.random(), { cache: 'no-store' })
    .then(function () {}, function () {});
}
/* Espera por condición: cede tiempo real en cada vuelta. */
function waitFor(cond, maxVueltas) {
  var n = 0, max = maxVueltas || 60;
  return new Promise(function (res) {
    (function loop() {
      var ok = false;
      try { ok = !!cond(); } catch (e) { ok = false; }
      if (ok) return res(true);
      if (n++ > max) return res(false);
      yieldReal().then(function () { setTimeout(loop, 5); });
    })();
  });
}
function finish() {
  var fails = results.filter(function (r) { return !r.ok; });
  log.textContent += '\n\n' + (fails.length ? 'FALLAS: ' + fails.length + ' de ' + results.length : 'TODO OK (' + results.length + ' comprobaciones)');
  log.className = fails.length ? 'bad' : 'ok';
  document.title = fails.length ? 'FALLA ' + fails.length : 'TODO OK';
}

(async function () {
  var frame = document.getElementById('app');
  var w, d;
  var errors = [];

  await new Promise(function (res) { frame.addEventListener('load', res, { once: true }); });
  w = frame.contentWindow; d = frame.contentDocument;
  w.addEventListener('error', function (e) { errors.push(String(e.message)); });
  await waitFor(function () { return w.HIERRO && w.HIERRO.CORE; }, 2000);

  // Sin service worker ni cachés: la prueba tiene que correr contra los
  // archivos reales, no contra una copia vieja guardada por el service worker.
  function conTimeout(p, maxVueltas) {
    var listo = false, val = null;
    Promise.resolve(p).then(function (v) { listo = true; val = v; }, function () { listo = true; });
    return waitFor(function () { return listo; }, maxVueltas || 200).then(function () { return val; });
  }
  try {
    if (w.navigator && w.navigator.serviceWorker) {
      var regs = await conTimeout(w.navigator.serviceWorker.getRegistrations(), 150);
      if (regs) for (var i = 0; i < regs.length; i++) { try { regs[i].unregister(); } catch (e) {} }
    }
    if (w.caches && w.caches.keys) {
      var claves = await conTimeout(w.caches.keys(), 150);
      if (claves) for (var j = 0; j < claves.length; j++) { await conTimeout(w.caches.delete(claves[j]), 200); }
    }
  } catch (e) { /* si no se puede, se sigue igual */ }

  // Estado limpio: se vacían las tablas (no se borra la base, que dejaría una
  // operación pendiente bloqueando la apertura siguiente).
  await new Promise(function (res) { w.HIERRO.CORE.store.reset().then(res, res); });
  w.localStorage.clear();
  await new Promise(function (res) {
    frame.addEventListener('load', res, { once: true });
    frame.contentWindow.location.reload();
  });
  w = frame.contentWindow; d = frame.contentDocument;
  w.addEventListener('error', function (e) { errors.push(String(e.message)); });
  await waitFor(function () { return w.HIERRO && w.HIERRO.ready; }, 2000);
  if (!w.HIERRO) throw new Error('la app no arrancó en el iframe');
  await w.HIERRO.ready;   // señal real: la app terminó de abrir la base
  await waitFor(function () { return d.querySelector('.gate') || d.querySelector('.tabbar') || d.querySelector('.view'); }, 600);
  w.confirm = function () { return true; };
  w.alert = function () {};
  w.prompt = function () { return null; };

  check('arranca en la pantalla de acceso', !!d.querySelector('.gate'),
    'main=' + (d.querySelector('#main') ? d.querySelector('#main').textContent.slice(0, 120) : 'sin main') +
    ' | traza=' + JSON.stringify(w.HIERRO && w.HIERRO.bootTrace) + ' | backend=' + w.HIERRO.CORE.store.backend());
  check('la base arrancó en IndexedDB', w.HIERRO && w.HIERRO.CORE && w.HIERRO.CORE.store.backend() === 'idb',
    w.HIERRO && w.HIERRO.CORE ? w.HIERRO.CORE.store.backend() : 'sin core');
  check('lo primero que aparece es el ingreso', !!d.querySelector('form[data-form="login"]'));
  check('el alta del administrador NO es la pantalla principal',
    d.querySelector('form[data-form="alta-admin"]') === null && !!d.querySelector('[data-act="gate-alta-admin"]'));
  check('no hay auto-registro: no existe la pestaña "Crear perfil"', d.querySelector('[data-act="gate-tab"]') === null);
  check('no hay errores de JS al arrancar', errors.length === 0, errors.join(' | '));

  // ── Alta del administrador (detrás de un enlace) ──────────────────────
  d.querySelector('[data-act="gate-alta-admin"]').click();
  await waitFor(function () { return !!d.querySelector('form[data-form="alta-admin"]'); }, 150);
  d = frame.contentDocument;
  check('el enlace abre el alta del administrador', !!d.querySelector('form[data-form="alta-admin"]'));
  var nameInput = d.querySelector('#regName');
  check('el formulario de alta existe', !!nameInput);
  d.querySelector('#regName').value = 'Tester';
  d.querySelector('#regPass').value = '1234';
  d.querySelector('[data-act="pick-objetivo"][data-value="fuerza"]').click();
  d.querySelector('form[data-form="alta-admin"]').requestSubmit();
  await waitFor(function () { return w.HIERRO.state.account; }, 400);

  var st = w.HIERRO.state;
  check('se creó el usuario', st.account && st.account.name === 'Tester', 'account=' + JSON.stringify(st.account && st.account.name));
  check('la primera cuenta es administradora', st.account && st.account.role === 'admin', st.account && st.account.role);
  check('la contraseña se guarda derivada (PBKDF2), no en claro',
    !!(st.account && /^pbkdf2\$150000\$/.test(st.account.hash)) && !JSON.stringify(st.account).includes('1234'),
    st.account && String(st.account.hash).slice(0, 22));
  var guardado = await conTimeout(w.HIERRO.CORE.store.document(st.account.id), 150);
  check('el documento se guardó en la base', !!guardado && guardado.schema === 2,
    'traza=' + JSON.stringify(w.HIERRO.bootTrace) + ' leido=' + (guardado ? JSON.stringify(guardado).slice(0, 80) : 'no resolvió'));
  check('el objetivo elegido se guardó', st.data.profile.objetivo === 'fuerza', st.data.profile.objetivo);
  check('la cuenta quedó espejada en localStorage (seguro contra bases vaciadas)',
    (w.localStorage.getItem('hierro.v2.users') || '').indexOf('Tester') !== -1);

  // ── Perfil incompleto: lo pide antes de entrenar ──────────────────────
  await waitFor(function () { return /Completá tu perfil/.test(d.querySelector('#main').textContent); }, 200);
  check('un usuario sin datos físicos es llevado a completar el perfil',
    /Completá tu perfil/.test(d.querySelector('#main').textContent));
  d.querySelector('#pfWeight').value = '82';
  d.querySelector('#pfWeight').dispatchEvent(new w.Event('change', { bubbles: true }));
  await waitFor(function () { return w.HIERRO.state.data.profile.weightKg === 82; }, 200);
  check('el peso se guarda desde el perfil', w.HIERRO.state.data.profile.weightKg === 82, String(w.HIERRO.state.data.profile.weightKg));
  await waitFor(function () { return !/Completá tu perfil/.test(d.querySelector('#main').textContent); }, 200);
  check('con el perfil completo deja de pedirlo', !/Completá tu perfil/.test(d.querySelector('#main').textContent));
  w.location.hash = '#/hoy';
  await waitFor(function () { return /Hola, Tester/.test(d.querySelector('#main').textContent); }, 200);

  // ── Dashboard ─────────────────────────────────────────────────────────
  await waitFor(function () { return /Hola, Tester/.test(d.querySelector('#main').textContent); }, 150);
/* El modo por defecto del entrenar es "por grupo muscular": para probar las
   rutinas listas hay que cambiar de solapa. */
async function modoRutinas() {
  if (d.querySelector('[data-act="start"]')) return;
  var chip = d.querySelector('[data-act="picker-mode"][data-value="rutinas"]');
  if (chip) chip.click();
  await waitFor(function () { return !!d.querySelector('[data-act="start"]'); }, 200);
  d = frame.contentDocument;
}
  check('el dashboard muestra el saludo', /Hola, Tester/.test(d.querySelector('#main').textContent));
  check('la rutina sugerida respeta el objetivo', /Fuerza A/.test(d.querySelector('#main').textContent));
  check('la barra de navegación tiene 4 secciones', d.querySelectorAll('.tab').length === 4);

  // ── Inicio de sesión ──────────────────────────────────────────────────
  await modoRutinas();
  d.querySelector('[data-act="start"]').click();
  await sleep(300);
  var s = w.HIERRO.state.data.activeSession;
  check('la sesión arrancó', !!s, 'activeSession nulo');
  check('la sesión trae los 4 ejercicios de Fuerza A', s && s.entries.length === 4, s && String(s.entries.length));
  check('las series se generan según la rutina', s && s.entries[0].sets.length === 5, s && String(s.entries[0].sets.length));

  // ── Carga de discos ───────────────────────────────────────────────────
  var plates = d.querySelector('#plates-0');
  check('se muestra la carga de discos', plates && /Barra 20 kg/.test(plates.textContent), plates && plates.textContent.slice(0, 60));
  check('la carga coincide con el peso de la primera serie', plates && /60 kg/.test(plates.textContent));

  // ── Marcar una serie ──────────────────────────────────────────────────
  var pre = w.HIERRO.state.data.activeSession.entries[0].sets[0].weight;
  d.querySelector('[data-act="set-toggle"]').click();
  await sleep(250);
  s = w.HIERRO.state.data.activeSession;
  check('la serie quedó completada', s.entries[0].sets[0].done === true);
  check('la fila de serie muestra el objetivo además del valor real', /6-10|8-10|5/.test(d.querySelector('.setrow').textContent), d.querySelector('.setrow').textContent.trim());
  check('el volumen de la sesión se calculó', /de volumen/.test(d.querySelector('#main').textContent));
  check('el descanso arrancó solo', w.HIERRO.state && /descanso|serie/.test(d.querySelector('#nextTitle').textContent));
  check('la banda de señal está visible', d.querySelector('#nextband').hidden === false);
  check('el cronómetro muestra un tiempo', /^\d+:\d\d$/.test(d.querySelector('#clockValue').textContent), d.querySelector('#clockValue').textContent);

  // ── Editar peso a mano (sobre la primera serie pendiente) ─────────────
  var pendIdx = w.HIERRO.state.data.activeSession.entries[0].sets.findIndex(function (x) { return !x.done; });
  var wInput = d.querySelectorAll('.unit')[0].querySelectorAll('[data-act="w-input"]')[pendIdx];
  wInput.value = '82,5';
  wInput.dispatchEvent(new w.Event('change', { bubbles: true }));
  await sleep(200);
  s = w.HIERRO.state.data.activeSession;
  check('el peso editado se guarda en kilos', Math.abs(s.entries[0].sets[pendIdx].weight - 82.5) < 0.01, String(s.entries[0].sets[pendIdx].weight));
  check('los discos siguen a la serie pendiente', /82,5 kg/.test(d.querySelector('#plates-0').textContent), d.querySelector('#plates-0').textContent.slice(0, 90));

  // ── Récord personal ───────────────────────────────────────────────────
  check('se registró el récord del ejercicio', !!w.HIERRO.state.data.prs['squat'], JSON.stringify(w.HIERRO.state.data.prs));

  // ── Agregar y quitar serie ────────────────────────────────────────────
  var before = w.HIERRO.state.data.activeSession.entries[0].sets.length;
  d.querySelector('[data-act="add-set"][data-entry="0"]').click();
  await sleep(200);
  check('se puede agregar una serie', w.HIERRO.state.data.activeSession.entries[0].sets.length === before + 1);
  d.querySelector('[data-act="del-set"][data-entry="0"]').click();
  await sleep(200);
  check('se puede quitar una serie', w.HIERRO.state.data.activeSession.entries[0].sets.length === before);

  // ── Hoja de técnica ───────────────────────────────────────────────────
  d.querySelector('[data-act="sheet"][data-entry="0"]').click();
  await sleep(250);
  check('la hoja de técnica se abre', d.querySelector('#sheet').hidden === false);
  check('la hoja muestra claves de ejecución', d.querySelectorAll('#sheetCues li').length >= 3, String(d.querySelectorAll('#sheetCues li').length));
  check('la hoja muestra la carga de barra', /Barra 20 kg/.test(d.querySelector('#sheetPlates').textContent));
  check('la hoja trae la figura o el diagrama', !!d.querySelector('#sheetFigure img, #sheetFigure svg'));
  d.querySelector('[data-close-sheet]').click();
  await sleep(150);
  check('la hoja de técnica se cierra', d.querySelector('#sheet').hidden === true);

  // ── Terminar sesión ───────────────────────────────────────────────────
  d.querySelector('[data-act="finish"]').click();
  await sleep(350);
  check('la sesión se guardó en el historial', w.HIERRO.state.data.sessions.length === 1, String(w.HIERRO.state.data.sessions.length));
  check('la sesión activa se limpió', w.HIERRO.state.data.activeSession === null);
  check('la vista cambió a Progreso', w.HIERRO.state.view === 'historial', w.HIERRO.state.view);
  check('el gráfico de volumen se dibuja', !!d.querySelector('#main svg.chart'));
  check('aparece la tabla de récords', /Récords personales/.test(d.querySelector('#main').textContent));

  // ── Selector de rutinas ───────────────────────────────────────────────
  w.location.hash = '#/entrenar';
  await waitFor(function () { return !!d.querySelector('[data-act="picker-mode"]'); }, 200);
  await modoRutinas();
  await waitFor(function () { return d.querySelectorAll('.routine').length > 0; }, 200);
  var soloObjetivo = d.querySelectorAll('.routine').length;
  check('sin sesión activa se ve el selector de rutinas', soloObjetivo > 0, String(soloObjetivo));
  d.querySelector('[data-act="filter"][data-value=""]').click();
  await sleep(300);
  d = frame.contentDocument;
  check('el filtro "Todas" muestra las 8 rutinas', d.querySelectorAll('.routine').length === 8, String(d.querySelectorAll('.routine').length));
  check('el chip "Todas" queda seleccionado', d.querySelector('[data-act="filter"][data-value=""]').getAttribute('aria-pressed') === 'true');

  // ── Fecha elegible, cantidad de ejercicios, cargas y calculadora ──────
  function isoLocal(x) {
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }
  var ayerLocal = (function () { var x = new Date(); x.setDate(x.getDate() - 1); return isoLocal(x); })();

  check('el selector de rutinas deja elegir el día', !!d.querySelector('#sessionDate'));
  check('la tarjeta de rutina muestra la carga sugerida de cada ejercicio', !!d.querySelector('.routine__load'), (d.querySelector('.routine__load') || {}).textContent);
  d.querySelector('[data-act="set-date"][data-value="' + ayerLocal + '"]').click();
  await sleep(260);
  d = frame.contentDocument;
  check('el chip "Ayer" queda seleccionado', d.querySelector('[data-act="set-date"][data-value="' + ayerLocal + '"]').getAttribute('aria-pressed') === 'true');

  await modoRutinas();
  d.querySelector('[data-act="start"]').click();
  await sleep(350);
  d = frame.contentDocument;
  var ses2 = w.HIERRO.state.data.activeSession;
  check('la sesión arranca con el día elegido', ses2 && ses2.date === ayerLocal, ses2 && ses2.date);
  check('el tracker deja corregir el día', !!d.querySelector('#sessDate'));

  var n0 = ses2.entries.length;
  d.querySelector('[data-act="open-picker"]').click();
  await sleep(300);
  d = frame.contentDocument;
  check('el selector de ejercicios se abre', d.querySelector('#picker').hidden === false);
  d.querySelector('#pickerBuscar').value = 'curl';
  d.querySelector('#pickerBuscar').dispatchEvent(new w.Event('input', { bubbles: true }));
  await sleep(260);
  d = frame.contentDocument;
  var coincidencias = d.querySelectorAll('#pickerLista [data-act="pick-exercise"]').length;
  check('el buscador filtra la lista', coincidencias > 0 && coincidencias < 72, String(coincidencias));
  d.querySelector('#pickerLista [data-act="pick-exercise"]').click();
  await sleep(320);
  d = frame.contentDocument;
  check('el ejercicio elegido se suma a la sesión', w.HIERRO.state.data.activeSession.entries.length === n0 + 1,
    String(w.HIERRO.state.data.activeSession.entries.length));

  var n1 = w.HIERRO.state.data.activeSession.entries.length;
  d.querySelectorAll('[data-act="del-exercise"]')[n1 - 1].click();
  await sleep(320);
  check('se puede quitar un ejercicio de la sesión', w.HIERRO.state.data.activeSession.entries.length === n1 - 1,
    String(w.HIERRO.state.data.activeSession.entries.length));

  d = frame.contentDocument;
  var s0 = w.HIERRO.state.data.activeSession.entries[0].sets[0];
  s0.weight = 55; s0.reps = 7;
  d.querySelector('[data-act="equalize"][data-entry="0"]').click();
  await sleep(300);
  var sets0 = w.HIERRO.state.data.activeSession.entries[0].sets;
  check('"Igualar" copia la primera serie a todas', sets0.every(function (x) { return x.weight === 55 && x.reps === 7; }),
    JSON.stringify(sets0.map(function (x) { return [x.weight, x.reps]; })));

  d = frame.contentDocument;
  d.querySelector('[data-act="discard"]').click();
  await sleep(320);

  // ── Progresión automática, 1RM estimado y músculos ────────────────────
  var P = w.HIERRO.progression;
  check('1RM: una repetición es medición, no estimación', P.estimate1RM(100, 1) === 100, String(P.estimate1RM(100, 1)));
  check('1RM: estima 100 kg × 10 como ~133 kg', Math.abs(P.estimate1RM(100, 10) - 133.3) < 0.2, String(P.estimate1RM(100, 10)));
  check('1RM: se niega a estimar arriba de 12 repeticiones', P.estimate1RM(100, 15) === null, String(P.estimate1RM(100, 15)));
  var rango = P.repRange('8-10');
  check('el objetivo "8-10" se lee como rango 8 a 10', rango.min === 8 && rango.max === 10, JSON.stringify(rango));

  // Se entrena HOY: es la sesión más reciente por fecha, que es la que manda.
  w.location.hash = '#/entrenar';
  await sleep(320);
  d = frame.contentDocument;
  var chipHoy = d.querySelector('[data-act="set-date"][data-value="' + isoLocal(new Date()) + '"]');
  if (chipHoy) chipHoy.click();
  await sleep(260);
  d = frame.contentDocument;
  await modoRutinas();
  d.querySelector('[data-act="start"]').click();
  await sleep(350);
  d = frame.contentDocument;
  var sesion = w.HIERRO.state.data.activeSession;
  check('la sesión arranca con una sugerencia de progresión', !!(sesion && sesion.entries[0].presc && sesion.entries[0].presc.why), JSON.stringify(sesion && sesion.entries[0].presc));

  var primer = sesion.entries[0];
  var tope = P.repRange(primer.sets[0].target).max;
  primer.sets.forEach(function (st) { st.reps = tope; st.done = true; });
  var pesoAntes = primer.sets[0].weight;
  d.querySelector('[data-act="finish"]').click();
  await sleep(450);

  var presc = P.prescriptionFor(primer.ex, { w: pesoAntes, reps: primer.sets[0].target }, 'fuerza');
  check('series completas: la próxima sesión sube el peso', presc.kind === 'up' && presc.weight > pesoAntes, JSON.stringify(presc));
  check('la sugerencia explica el motivo', /sube/.test(presc.why), presc.why);
  check('el historial de un ejercicio queda en orden cronológico', (function () {
    var h = P.exerciseHistory(primer.ex);
    return h.length >= 2 && h[h.length - 1].date >= h[0].date;
  })());

  var musculos = P.muscleStats(7);
  check('el volumen por músculo se calcula', musculos.length > 0 && musculos[0].volume > 0, JSON.stringify(musculos.slice(0, 2)));
  check('cada músculo trae su estado de recuperación', musculos.every(function (m) { return m.state === 'listo' || m.state === 'recuperando'; }));
  check('hay al menos un ejercicio con 1RM estimado', !!P.best1RMOf(primer.ex), primer.ex);

  // ── Armado del día por grupo muscular ─────────────────────────────────
  w.location.hash = '#/entrenar';
  await waitFor(function () { return !!d.querySelector('[data-act="picker-mode"]'); }, 200);
  var chipGrupos = d.querySelector('[data-act="picker-mode"][data-value="grupos"]');
  if (chipGrupos && !d.querySelector('[data-act="toggle-grupo"]')) chipGrupos.click();
  await waitFor(function () { return !!d.querySelector('[data-act="toggle-grupo"]'); }, 200);
  d = frame.contentDocument;
  check('se puede armar el día por grupo muscular', d.querySelectorAll('[data-act="toggle-grupo"]').length >= 8,
    String(d.querySelectorAll('[data-act="toggle-grupo"]').length));
  check('los grupos musculares están separados y con nombre',
    /Grupo muscular|grupo muscular/i.test(d.querySelector('#main').textContent) && /Pecho/.test(d.querySelector('#main').textContent));
  check('las rutinas listas siguen estando', !!d.querySelector('[data-act="picker-mode"][data-value="rutinas"]'));

  d.querySelector('[data-act="toggle-grupo"][data-value="Pecho"]').click();
  await waitFor(function () { return w.HIERRO.state.data.borrador.ejercicios.length > 0; }, 200);
  d = frame.contentDocument;
  d.querySelector('[data-act="toggle-grupo"][data-value="Tríceps"]').click();
  await waitFor(function () { return w.HIERRO.state.data.borrador.grupos.length === 2; }, 200);
  var borr = w.HIERRO.state.data.borrador;
  check('elegir un grupo trae sus ejercicios', borr.ejercicios.length >= 4, JSON.stringify(borr.ejercicios.length));
  check('los grupos elegidos quedan registrados', borr.grupos.join('+') === 'Pecho+Tríceps', borr.grupos.join('+'));
  check('los ejercicios elegidos son de esos grupos', borr.ejercicios.every(function (k) {
    var ex = null;
    w.HIERRO.DB.exercises.forEach(function (x) { if (x.key === k) ex = x; });
    return ex && (ex.muscle === 'Pecho' || ex.muscle === 'Tríceps');
  }));
  d = frame.contentDocument;
  check('el catálogo del día se muestra por grupo', d.querySelectorAll('.board__title').length >= 2,
    String(d.querySelectorAll('.board__title').length));

  var antesDelDia = borr.ejercicios.length;
  var primeroDelDia = borr.ejercicios[0];
  d.querySelector('[data-act="toggle-ejercicio"][data-ex="' + primeroDelDia + '"]').click();
  await waitFor(function () { return w.HIERRO.state.data.borrador.ejercicios.length === antesDelDia - 1; }, 200);
  check('se puede sacar un ejercicio del día', w.HIERRO.state.data.borrador.ejercicios.length === antesDelDia - 1);

  d = frame.contentDocument;
  d.querySelector('[data-act="start-builder"]').click();
  await waitFor(function () { return w.HIERRO.state.data.activeSession; }, 300);
  var armada = w.HIERRO.state.data.activeSession;
  check('empezar arma la sesión con los ejercicios elegidos', armada && armada.entries.length === antesDelDia - 1,
    armada && String(armada.entries.length));
  check('la sesión se llama como los grupos elegidos',
    !!armada && /Pecho/.test(armada.routineName) && /Tríceps/.test(armada.routineName), armada && armada.routineName);

  // ── Cronómetro por ejercicio con final automático ─────────────────────
  d = frame.contentDocument;
  await waitFor(function () { return !!d.querySelector('[data-act="timer-start"]'); }, 200);
  check('cada ejercicio trae cronómetro', !!d.querySelector('[data-act="timer-start"]'));
  check('arranca con la duración por defecto', /Start 1:30/.test(d.querySelector('[data-act="timer-start"]').textContent),
    d.querySelector('[data-act="timer-start"]').textContent.trim());
  d.querySelector('[data-act="timer-set"][data-seg="30"]').click();
  await waitFor(function () { return /Start 0:30/.test((d.querySelector('[data-act="timer-start"]') || {}).textContent || ''); }, 200);
  check('se puede cambiar la duración', /Start 0:30/.test(d.querySelector('[data-act="timer-start"]').textContent),
    d.querySelector('[data-act="timer-start"]').textContent.trim());

  d.querySelector('[data-act="timer-start"]').click();
  await waitFor(function () {
    var t = w.HIERRO.state.data.activeSession.timer;
    return t && t.running;
  }, 200);
  check('el cronómetro arranca y queda andando', !!(w.HIERRO.state.data.activeSession.timer || {}).running);
  check('el cronómetro se guarda con el ejercicio y su duración', (function () {
    var t = w.HIERRO.state.data.activeSession.timer;
    return t && t.totalSec === 30 && t.entryIndex === 0;
  })(), JSON.stringify(w.HIERRO.state.data.activeSession.timer));
  d = frame.contentDocument;
  check('mientras corre se ve la cuenta y se puede pausar', !!d.querySelector('[data-act="timer-pause"]'));
  d.querySelector('[data-act="timer-pause"]').click();
  await waitFor(function () { return w.HIERRO.state.data.activeSession.timer.running === false; }, 200);
  check('se puede pausar', w.HIERRO.state.data.activeSession.timer.running === false);
  d = frame.contentDocument;
  check('en pausa aparece "Seguir"', !!d.querySelector('[data-act="timer-resume"]'));
  d.querySelector('[data-act="timer-resume"]').click();
  await waitFor(function () { return w.HIERRO.state.data.activeSession.timer.running === true; }, 200);
  check('se puede reanudar', w.HIERRO.state.data.activeSession.timer.running === true);

  // Final automático: se adelanta el reloj del cronómetro para no esperar.
  w.HIERRO.state.data.activeSession.timer.endsAt = Date.now() + 400;
  await waitFor(function () {
    var t = w.HIERRO.state.data.activeSession.timer;
    return t && t.fired === true;
  }, 300);
  check('el cronómetro termina solo, sin tocar nada', !!(w.HIERRO.state.data.activeSession.timer || {}).fired,
    JSON.stringify(w.HIERRO.state.data.activeSession.timer));
  d = frame.contentDocument;
  check('al terminar muestra FIN', /FIN/.test(d.querySelector('#main').textContent));
  check('al terminar deja de latir', w.HIERRO.state.data.activeSession.timer.running === false);
  d.querySelector('[data-act="timer-stop"]').click();
  await waitFor(function () { return w.HIERRO.state.data.activeSession.timer === null; }, 200);
  check('se puede cerrar el cronómetro', w.HIERRO.state.data.activeSession.timer === null);

  // ── Persistencia ──────────────────────────────────────────────────────
  await new Promise(function (res) {
    frame.addEventListener('load', res, { once: true });
    frame.contentWindow.location.reload();
  });
  w = frame.contentWindow; d = frame.contentDocument;
  w.addEventListener('error', function (e) { errors.push(String(e.message)); });
  w.confirm = function () { return true; };
  w.alert = function () {};
  w.prompt = function () { return null; };
  await waitFor(function () { return w.HIERRO && w.HIERRO.ready; });
  await w.HIERRO.ready;
  await waitFor(function () { return w.HIERRO.state.account; }, 150);
  check('la sesión del usuario persiste tras recargar', !!w.HIERRO.state.account,
    'traza=' + JSON.stringify(w.HIERRO.bootTrace));
  check('el historial persiste tras recargar', w.HIERRO.state.data.sessions.length >= 2, String(w.HIERRO.state.data.sessions.length));
  check('el perfil completo persiste tras recargar', Math.round(w.HIERRO.state.data.profile.weightKg) === 82, JSON.stringify(w.HIERRO.state.data.profile));

  // ── Cambio de unidad ──────────────────────────────────────────────────
  w.location.hash = '#/perfil';
  await sleep(300);
  d = frame.contentDocument;
  check('el perfil trae la calculadora de discos', !!d.querySelector('#calcWeight'));
  var calc = d.querySelector('#calcWeight');
  calc.value = '100';
  calc.dispatchEvent(new w.Event('input', { bubbles: true }));
  await sleep(220);
  d = frame.contentDocument;
  check('la calculadora muestra los discos del peso escrito',
    /Barra 20 kg/.test(d.querySelector('#calcPlates').textContent) && /100 kg/.test(d.querySelector('#calcPlates').textContent),
    d.querySelector('#calcPlates').textContent.slice(0, 90));

  var unitSel = d.querySelector('#pfUnit');
  unitSel.value = 'lb';
  unitSel.dispatchEvent(new w.Event('change', { bubbles: true }));
  await sleep(300);
  check('la unidad cambia a libras', w.HIERRO.state.data.prefs.unit === 'lb');
  d = frame.contentDocument;
  check('el peso se convierte a libras en pantalla', /^180,7/.test(d.querySelector('#pfWeight').value), d.querySelector('#pfWeight').value);
  check('la etiqueta del peso usa la unidad activa', /Peso actual \(lb\)/.test(d.querySelector('#main').textContent));
  check('el peso se sigue guardando en kilos', Math.round(w.HIERRO.state.data.profile.weightKg) === 82, JSON.stringify(w.HIERRO.state.data.profile) + ' | acct=' + JSON.stringify(w.HIERRO.state.account && w.HIERRO.state.account.profile));

  // ── Interruptores nuevos del perfil ──────────────────────────────────
  check('el perfil ofrece pantalla encendida y progresión automática',
    !!d.querySelector('[data-act="toggle-wake"]') && !!d.querySelector('[data-act="toggle-prog"]'));
  d.querySelector('[data-act="toggle-wake"]').click();
  await sleep(280);
  d = frame.contentDocument;
  check('la pantalla encendida se puede apagar', w.HIERRO.state.data.prefs.wake === false, String(w.HIERRO.state.data.prefs.wake));
  d.querySelector('[data-act="toggle-wake"]').click();
  await sleep(220);
  d = frame.contentDocument;
  check('y se puede volver a encender', w.HIERRO.state.data.prefs.wake === true, String(w.HIERRO.state.data.prefs.wake));
  d.querySelector('[data-act="toggle-prog"]').click();
  await sleep(280);
  d = frame.contentDocument;
  check('la progresión automática se puede desactivar', w.HIERRO.state.data.prefs.prog === false);
  var sinProg = w.HIERRO.progression.prescriptionFor('squat', { w: 60, reps: '5' }, 'fuerza');
  check('desactivada, la sugerencia no cambia el peso', sinProg.kind === 'off' && sinProg.weight === 60, JSON.stringify(sinProg));
  d.querySelector('[data-act="toggle-prog"]').click();
  await sleep(220);
  d = frame.contentDocument;

  // ── Cambio de contraseña ──────────────────────────────────────────────
  var userid = w.HIERRO.state.users[0].id;
  d.querySelector('[data-act="pass-toggle"]').click();
  await sleep(200);
  d = frame.contentDocument;
  d.querySelector('#newPass').value = 'nueva1234';
  d.querySelector('#newPass2').value = 'nueva1234';
  d.querySelector('form[data-form="password"]').requestSubmit();
  await waitFor(function () { return d.querySelector('#passForm').hidden === true; }, 150);
  check('el cambio de contraseña cierra el formulario', d.querySelector('#passForm').hidden === true,
    'error=' + (d.querySelector('#passError') ? d.querySelector('#passError').textContent : 'sin nodo') +
    ' | hash=' + String(w.HIERRO.state.account && w.HIERRO.state.account.hash).slice(0, 20) +
    ' | traza=' + JSON.stringify((w.HIERRO.CORE.trace || []).slice(-10)));

  d.querySelector('[data-act="logout"]').click();
  await waitFor(function () { return !!d.querySelector('.gate'); }, 150);
  check('cerrar sesión vuelve a la pantalla de acceso', !!d.querySelector('.gate'));

  d.querySelector('#loginUser').value = w.HIERRO.state.users[0].name;
  d.querySelector('#loginPass').value = '1234';
  d.querySelector('form[data-form="login"]').requestSubmit();
  await waitFor(function () { return d.querySelector('#loginError') && !d.querySelector('#loginError').hidden; }, 150);
  check('la contraseña vieja ya no entra', w.HIERRO.state.account === null, 'entró con la vieja');

  d = frame.contentDocument;
  d.querySelector('#loginUser').value = 'NombreQueNoExiste';
  d.querySelector('#loginPass').value = 'nueva1234';
  d.querySelector('form[data-form="login"]').requestSubmit();
  await waitFor(function () { return d.querySelector('#loginError') && !d.querySelector('#loginError').hidden; }, 150);
  check('un nombre inexistente no entra', w.HIERRO.state.account === null);
  check('el aviso de nombre inexistente se muestra', /no hay ningún usuario/i.test(d.querySelector('#loginError').textContent), d.querySelector('#loginError').textContent);

  d.querySelector('#loginUser').value = w.HIERRO.state.users[0].name;
  d.querySelector('#loginPass').value = 'nueva1234';
  d.querySelector('form[data-form="login"]').requestSubmit();
  await waitFor(function () { return w.HIERRO.state.account !== null; }, 300);
  check('entra escribiendo el nombre y la contraseña nueva', w.HIERRO.state.account !== null,
    'error=' + (d.querySelector('#loginError') ? d.querySelector('#loginError').textContent : 'sin nodo'));

  // El ingreso termina navegando a "Hoy": hay que dejarlo terminar antes de
  // cambiar de pantalla, o la navegación pisa el cambio.
  await waitFor(function () { return /Hola,/.test(d.querySelector('#main').textContent); }, 300);

  // ── Administración de usuarios (solo el administrador) ────────────────
  w.location.hash = '#/perfil';
  await waitFor(function () { return /Alta de usuario/.test(d.querySelector('#main').textContent); }, 300);
  d = frame.contentDocument;
  check('el administrador ve el panel de usuarios', /Alta de usuario/.test(d.querySelector('#main').textContent));
  d.querySelector('#nuNombre').value = 'Ana';
  d.querySelector('#nuClave').value = 'ana12345';
  d.querySelector('form[data-form="nuevo-usuario"]').requestSubmit();
  await waitFor(function () { return w.HIERRO.usuarios.porNombre('Ana'); }, 300);
  await waitFor(function () { return /Ana/.test(d.querySelector('#main').textContent); }, 300);
  d = frame.contentDocument;
  var ana = w.HIERRO.usuarios.porNombre('Ana');
  check('el administrador da de alta un usuario', !!ana, JSON.stringify(w.HIERRO.state.users.map(function (u) { return u.name; })));
  check('el usuario nuevo no es administrador', ana && ana.role === 'user', ana && ana.role);
  check('su contraseña queda derivada con PBKDF2', !!(ana && /^pbkdf2\$150000\$/.test(ana.hash)));
  check('el panel lista a los dos usuarios', /Ana/.test(d.querySelector('#main').textContent) && /Tester/.test(d.querySelector('#main').textContent),
    'main=' + d.querySelector('#main').textContent.slice(0, 100));

  var enlace = w.HIERRO.usuarios.enlace(ana);
  check('el enlace de alta lleva la cuenta pero no la contraseña',
    enlace.indexOf('#alta=') > -1 && enlace.indexOf('ana12345') === -1, enlace.slice(0, 64) + '…');
  var pack = w.HIERRO.CORE.packs.unpackAccount(decodeURIComponent(enlace.split('#alta=')[1]));
  check('el enlace se puede leer de vuelta', !!pack && pack.name === 'Ana', pack && pack.name);

  await waitFor(function () { return !!d.querySelector('[data-act="export-csv"]'); }, 300);
  check('el perfil ofrece exportar CSV', !!d.querySelector('[data-act="export-csv"]'),
    'main=' + d.querySelector('#main').textContent.slice(0, 100));
  var csv = w.HIERRO.CORE.csv.sessionsToCsv(w.HIERRO.state.data.sessions);
  check('el CSV del historial tiene encabezado y filas', csv.split('\r\n').length >= 2, csv.split('\r\n')[0]);
  var respaldos = await new Promise(function (res) { w.HIERRO.CORE.store.backups().then(res); });
  check('hay un respaldo automático guardado', respaldos.length >= 1, String(respaldos.length));

  // Desactivar a Ana y comprobar que no puede entrar
  d.querySelector('[data-act="u-toggle"][data-user="' + ana.id + '"]').click();
  await sleep(900);
  var anaOff = w.HIERRO.state.users.filter(function (u) { return u.id === ana.id; })[0];
  check('el administrador puede desactivar a un usuario', anaOff.disabled === true);

  d = frame.contentDocument;
  d.querySelector('[data-act="logout"]').click();
  await waitFor(function () { return !!d.querySelector('.gate'); }, 150);
  d = frame.contentDocument;
  d.querySelector('#loginUser').value = 'Ana';
  d.querySelector('#loginPass').value = 'ana12345';
  d.querySelector('form[data-form="login"]').requestSubmit();
  await waitFor(function () { return d.querySelector('#loginError') && !d.querySelector('#loginError').hidden; }, 300);
  check('un usuario desactivado no puede entrar', w.HIERRO.state.account === null, 'entró igual');
  check('y el aviso lo explica', /desactivado/i.test(d.querySelector('#loginError').textContent), d.querySelector('#loginError').textContent);

  // El administrador vuelve y la reactiva
  d = frame.contentDocument;
  d.querySelector('#loginUser').value = 'Tester';
  d.querySelector('#loginPass').value = 'nueva1234';
  d.querySelector('form[data-form="login"]').requestSubmit();
  await waitFor(function () { return w.HIERRO.state.account && w.HIERRO.state.account.name === 'Tester'; }, 300);
  await waitFor(function () { return /Hola,/.test(d.querySelector('#main').textContent); }, 300);
  check('el administrador vuelve a entrar', !!(w.HIERRO.state.account && w.HIERRO.state.account.name === 'Tester'));
  w.location.hash = '#/perfil';
  await waitFor(function () { return !!d.querySelector('[data-act="u-toggle"][data-user="' + ana.id + '"]'); }, 300);
  d.querySelector('[data-act="u-toggle"][data-user="' + ana.id + '"]').click();
  await waitFor(function () {
    var u = w.HIERRO.state.users.filter(function (x) { return x.id === ana.id; })[0];
    return u && u.disabled === false;
  }, 300);
  check('la reactivación deja al usuario activo',
    w.HIERRO.state.users.filter(function (u) { return u.id === ana.id; })[0].disabled === false);

  // ── Migración desde el formato viejo (localStorage v1) ────────────────
  // La contraseña vieja usaba SHA-256 de una pasada: se calcula igual que antes
  // para comprobar que un usuario migrado puede entrar con su clave de siempre.
  var salVieja = 'salv';
  var claveVieja = 'claveVieja1';
  var bufViejo = await w.crypto.subtle.digest('SHA-256', new w.TextEncoder().encode(salVieja + '::' + claveVieja));
  var hashViejo = Array.prototype.map.call(new w.Uint8Array(bufViejo), function (b) { return b.toString(16).padStart(2, '0'); }).join('');

  await new Promise(function (res) { w.HIERRO.CORE.store.reset().then(res, res); });
  w.localStorage.setItem('hierro.v1.users', JSON.stringify([{
    id: 'viejo1', name: 'Viejo', salt: salVieja, hash: hashViejo, createdAt: 1700000000000,
    profile: { name: 'Viejo', weightKg: 90, heightCm: 180, objetivo: 'fuerza', level: 'Intermedio', days: 3 },
  }]));
  w.localStorage.setItem('hierro.v1.session', JSON.stringify('viejo1'));
  w.localStorage.setItem('hierro.v1.user.viejo1', JSON.stringify({
    profile: { weightKg: 90 }, prefs: { unit: 'kg', barKg: 20 },
    sessions: [{ id: 's1', date: '2026-01-01', routineName: 'Vieja', objetivo: 'fuerza', entries: [], startedAt: 1, finishedAt: 2 }],
    prs: { squat: { name: 'Sentadilla trasera', weightKg: 110, reps: 5, date: '2026-01-01' } },
    bodyweight: [{ date: '2026-01-01', kg: 90 }],
  }));
  await new Promise(function (res) {
    frame.addEventListener('load', res, { once: true });
    frame.contentWindow.location.reload();
  });
  w = frame.contentWindow; d = frame.contentDocument;
  w.addEventListener('error', function (e) { errors.push(String(e.message)); });
  w.confirm = function () { return true; };
  w.alert = function () {};
  w.prompt = function () { return null; };
  await waitFor(function () { return w.HIERRO && w.HIERRO.ready; });
  await w.HIERRO.ready;
  await waitFor(function () { return w.HIERRO.state.users.length > 0; }, 300);

  check('los datos del formato viejo se migran solos', w.HIERRO.state.users.length === 1 && w.HIERRO.state.users[0].name === 'Viejo',
    'usuarios=' + w.HIERRO.state.users.length);
  check('el usuario migrado queda como administrador', w.HIERRO.state.users[0].role === 'admin', w.HIERRO.state.users[0].role);
  check('el historial viejo llega completo', w.HIERRO.state.data.sessions.length === 1,
    String(w.HIERRO.state.data.sessions.length));
  check('los récords viejos se conservan', !!(w.HIERRO.state.data.prs.squat && w.HIERRO.state.data.prs.squat.weightKg === 110));
  check('el respaldo viejo NO se borra', !!w.localStorage.getItem('hierro.v1.users') && !!w.localStorage.getItem('hierro.v1.user.viejo1'));

  // Y con la contraseña de siempre tiene que poder entrar (y se actualiza sola).
  await new Promise(function (res) { w.HIERRO.CORE.store.setSessionId(null).then(res, res); });
  await new Promise(function (res) { frame.addEventListener('load', res, { once: true }); w.location.reload(); });
  w = frame.contentWindow; d = frame.contentDocument;
  w.addEventListener('error', function (e) { errors.push(String(e.message)); });
  await waitFor(function () { return w.HIERRO && w.HIERRO.ready; });
  await w.HIERRO.ready;
  await waitFor(function () { return !!d.querySelector('#loginUser'); }, 300);
  d.querySelector('#loginUser').value = 'Viejo';
  d.querySelector('#loginPass').value = claveVieja;
  d.querySelector('form[data-form="login"]').requestSubmit();
  await waitFor(function () { return w.HIERRO.state.account !== null; }, 300);
  check('el usuario migrado entra con su contraseña de siempre', !!w.HIERRO.state.account,
    'error=' + (d.querySelector('#loginError') ? d.querySelector('#loginError').textContent : 'sin nodo'));
  var migrado = w.HIERRO.state.users[0];
  check('y su credencial se actualiza al formato nuevo', !!(migrado && migrado.iterations === 150000 && /^pbkdf2\$/.test(migrado.hash)),
    String(migrado && migrado.hash).slice(0, 24));

  // ── Espejo de seguridad: si la base principal se vacía ────────────────
  await new Promise(function (res) { w.HIERRO.CORE.store.wipeBase().then(res, res); });
  await new Promise(function (res) {
    frame.addEventListener('load', res, { once: true });
    w.location.reload();
  });
  w = frame.contentWindow; d = frame.contentDocument;
  w.addEventListener('error', function (e) { errors.push(String(e.message)); });
  await waitFor(function () { return w.HIERRO && w.HIERRO.ready; });
  await w.HIERRO.ready;
  await waitFor(function () { return w.HIERRO.state.users.length > 0; }, 300);
  check('si la base se vacía, la cuenta vuelve desde el espejo', w.HIERRO.state.users.length > 0,
    'usuarios=' + w.HIERRO.state.users.length);
  check('y el historial también se recupera',
    !!(w.HIERRO.state.account && w.HIERRO.state.data && w.HIERRO.state.data.sessions.length > 0),
    'sesiones=' + (w.HIERRO.state.data ? w.HIERRO.state.data.sessions.length : 'sin datos'));

  check('sin errores de JS durante todo el recorrido', errors.length === 0, errors.join(' | '));
  finish();
})().catch(function (e) {
  log.textContent += '\nEXCEPCIÓN: ' + (e && e.stack || e);
  log.className = 'bad';
  document.title = 'EXCEPCION';
});
</script>
</body>
</html>
